name: Atualizar arquivos do dashboard

on:
  push:
    paths:
      - "data/revisoes_aprovadas.json"
      - "paineis/painel_itens.csv"
      - "paineis/painel_volumetria.csv"
      - "paineis/painel_nlp.csv"
      - "paineis/painel_dados_atualizaveis.csv"
      - "codigos/gerar_dashboard_estatico.py"
      - "codigos/gerar_exportacoes_dashboard.py"
      - "codigos/livro_dashboard.py"
      - "hsia_linkedin_2017_2018_estruturado/ARTIGOS.md"
      - "hsia_linkedin_2017_2018_estruturado/artigos/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-revisoes
  cancel-in-progress: true

jobs:
  gerar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependência do Excel
        run: python -m pip install openpyxl==3.1.5
      - name: Gerar dados e planilhas
        run: |
          python codigos/gerar_dashboard_estatico.py
          python codigos/gerar_exportacoes_dashboard.py
      - name: Validar arquivos gerados
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          data=json.loads(Path("data/dashboard.json").read_text(encoding="utf-8"))
          livro=json.loads(Path("data/livro.json").read_text(encoding="utf-8"))
          with Path("data/painel_itens.csv").open(encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          assert rows, "painel_itens.csv ficou vazio"
          assert all(r["manifestacao_id"] and r["titulo"] and r["fonte"] for r in rows)
          assert len(livro["chapters"]) == 17 and livro["relations"], "livro.json ficou incompleto"
          assert all(r["item_id"] in livro["items"] for r in livro["relations"])
          locais=[item for item in data["itens"] if item.get("conteudo_local")]
          assert len(locais) == 52, "os 52 artigos locais não foram associados"
          assert sum(item.get("origem_externa_indisponivel") is True for item in locais) == 3
          assert all(Path(item["conteudo_local"]).is_file() for item in locais)
          assert all("fonte_original" not in item["conteudo_local"] and not item["conteudo_local"].endswith(".docx") for item in locais)
          print(f"{len(rows)} manifestações validadas")
          PY
      - name: Registrar resultados atualizados
        run: |
          git config user.name "Alison-Sousa"
          git config user.email "116979938+Alison-Sousa@users.noreply.github.com"
          git add data/dashboard.json data/livro.json data/painel_itens.csv data/painel_volumetria.csv data/acervo_hsia_atualizado.xlsx data/creditos_editoriais.json
          git diff --cached --quiet || git commit -m "dashboard: atualizar CSVs e Excel"
          git push
